<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="lchigo 的浏览器工具集合。">
    <title>lchigo · Tools</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="./" aria-label="返回工具首页">
                <span class="brand-mark" aria-hidden="true">L</span>
                <span>lchigo / tools</span>
            </a>
            <a class="github-link" href="https://github.com/lchigo" rel="me">GitHub ↗</a>
        </header>

        <main>
            <section class="hero" aria-labelledby="page-title">
                <p class="eyebrow">LOCAL-FIRST WEB TOOLS</p>
                <h1 id="page-title">简单、直接，<br>打开浏览器就能用。</h1>
                <p class="hero-copy">这里收录一些轻量的小工具。无需登录，数据尽可能只留在你的设备上。</p>
            </section>

            <section class="tools-section" aria-labelledby="tools-title">
                <div class="section-heading">
                    <h2 id="tools-title">Tools</h2>
                    <span>01 available</span>
                </div>

                <a class="tool-card" href="./tools/comic-reader/">
                    <span class="tool-icon">
                        <img src="./tools/comic-reader/icon.png" alt="">
                    </span>
                    <span class="tool-content">
                        <span class="tool-meta">阅读 · 本地运行</span>
                        <strong>本地漫画阅读器</strong>
                        <span class="tool-description">打开图片文件夹或 ZIP / CBZ 漫画包，支持单双页、阅读方向和进度记忆。</span>
                        <span class="tool-tags" aria-label="功能标签">
                            <span>Offline</span>
                            <span>ZIP / CBZ</span>
                            <span>Mobile</span>
                        </span>
                    </span>
                    <span class="tool-arrow" aria-hidden="true">↗</span>
                </a>
            </section>
        </main>

        <footer>
            <span>Built for the open web.</span>
            <span>© 2026 lchigo</span>
        </footer>
    </div>
</body>
</html>
