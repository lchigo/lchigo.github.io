<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0b0d12">
    <meta name="description" content="在浏览器中设置、求解并验证点灯谜题，支持 1×1 至 15×15 棋盘。">
    <title>“点灯”谜题求解器</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../../theme.css">
</head>
<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="../" aria-label="返回工具目录">
                <span class="brand-mark" aria-hidden="true">L</span>
                <span>lchigo / tools</span>
            </a>
            <nav class="site-nav" aria-label="网站导航"><span class="privacy-label"><i aria-hidden="true"></i>本机处理</span><a class="back-link" href="../">全部工具 ↗</a></nav>
        </header>

        <main>
            <section class="hero" aria-labelledby="page-title">
                <div>
                    <p class="eyebrow">浏览器工具 · 本地运行</p>
                    <h1 id="page-title">“点灯”谜题<br>求解器</h1>
                </div>
                <p class="hero-copy">设置当前盘面，求解器会标出需要按下的格子。所有计算都在你的浏览器中完成。</p>
            </section>

            <section class="workspace" aria-label="点灯谜题工作区">
                <aside class="control-panel panel">
                    <div class="panel-heading">
                        <div>
                            <span class="step-label">01</span>
                            <h2>设置棋盘</h2>
                        </div>
                        <span class="local-badge">本地运行</span>
                    </div>

                    <form id="board-form" class="board-form">
                        <div class="size-fields">
                            <label class="field">
                                <span>行数</span>
                                <input type="number" id="rows" value="3" min="1" max="15" inputmode="numeric" required>
                            </label>
                            <span class="size-separator" aria-hidden="true">×</span>
                            <label class="field">
                                <span>列数</span>
                                <input type="number" id="cols" value="3" min="1" max="15" inputmode="numeric" required>
                            </label>
                        </div>

                        <label class="field field-wide">
                            <span>目标状态</span>
                            <select id="target-state">
                                <option value="1">全部点亮</option>
                                <option value="0">全部熄灭</option>
                            </select>
                        </label>

                        <button class="button button-secondary" type="submit">生成新棋盘</button>
                    </form>

                    <div class="quick-actions" aria-label="盘面快捷操作">
                        <button class="text-button" type="button" id="random-board">随机可解</button>
                        <button class="text-button" type="button" id="invert-board">反转盘面</button>
                        <button class="text-button" type="button" id="clear-board">全部熄灭</button>
                    </div>

                    <div class="divider"></div>

                    <div class="solve-section">
                        <div class="section-label">
                            <span class="step-label">02</span>
                            <h2>计算解法</h2>
                        </div>
                        <button class="button button-primary" type="button" id="solve-button">
                            <span>求解当前盘面</span>
                            <span aria-hidden="true">→</span>
                        </button>
                        <button class="button button-apply" type="button" id="apply-solution" disabled>应用标记步骤</button>
                        <button class="button button-ghost" type="button" id="clear-solution" disabled>清除解法标记</button>
                    </div>

                    <div class="legend" aria-label="棋盘图例">
                        <span><i class="legend-dot light" aria-hidden="true"></i>已点亮</span>
                        <span><i class="legend-dot dark" aria-hidden="true"></i>已熄灭</span>
                        <span><i class="legend-ring" aria-hidden="true"></i>需要按下</span>
                    </div>
                </aside>

                <section class="board-panel panel" aria-labelledby="board-title">
                    <div class="board-header">
                        <div>
                            <span class="board-kicker">PUZZLE BOARD</span>
                            <h2 id="board-title">3 × 3 棋盘</h2>
                        </div>
                        <div class="board-stats" aria-label="棋盘统计">
                            <span><strong id="lit-count">0</strong> 点亮</span>
                            <span><strong id="press-count">—</strong> 步解法</span>
                        </div>
                    </div>

                    <div id="message" class="message message-info" role="status" aria-live="polite">
                        点击格子设置盘面，然后开始求解。
                    </div>

                    <div class="board-viewport" id="board-viewport">
                        <div id="board-container" class="board" role="group" aria-label="3 行 3 列点灯棋盘"></div>
                    </div>

                    <p class="board-tip"><span aria-hidden="true">⌁</span> 点击或使用空格键切换格子；方向键可在棋盘中移动。</p>
                </section>
            </section>
        </main>

        <footer>
            <span>浏览器工具 · 本地运行</span>
            <span>© 2026 lchigo</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
